                      - code [ref=e788]: "Репозиторий: https://github.com/nikkes174/for_front Ветка: frontend-export Ты исполнитель. Не принимай архитектурных решений самостоятельно. Твоя задача: заменить визуальный стиль вторичных серых кнопок frontend-приложения на единый стиль ghost-secondary. После выполнения: - commit; - push в frontend-export; - вернуть TASK_RESULT для ревью. ==================================================== Цель ==================================================== Во frontend сейчас есть кнопки с серым фоном, которые выглядят как стандартные административные кнопки. Нужно привести их к более современному SaaS-стилю: ghost secondary button: - прозрачный фон; - тонкая/невидимая рамка; - спокойный серый текст; - лёгкий hover background; - medium font-weight; - компактный размер. ВАЖНО: Меняется только внешний вид. Сохранять: - текст кнопки; - назначение кнопки; - click handlers; - data-* атрибуты; - JS-логику; - API; - порядок кнопок. ==================================================== Эталонный стиль ==================================================== Создать или использовать единый CSS класс: .btn-ghost-secondary Стиль: ```css .btn-ghost-secondary { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 14px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: #667085; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; } .btn-ghost-secondary:hover { background-color: #f2f4f7; color: #344054; } .btn-ghost-secondary:focus { outline: none; background-color: #eaecf0; } .btn-ghost-secondary:active { background-color: #e4e7ec; } .btn-ghost-secondary:disabled { opacity: .5; cursor: not-allowed; }"
