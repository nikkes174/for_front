                        - code [ref=e1445]: "Репозиторий: https://github.com/nikkes174/for_front Рабочая ветка: frontend-export Работай поверх текущего HEAD ветки frontend-export. Ты — только исполнитель. Архитектурные решения и scope уже определены ниже. Не исследуй проект для выбора того, какие кнопки менять. Меняй только перечисленные ниже элементы. После изменений: commit + push в frontend-export, верни TASK_RESULT и остановись. ==================================================== ЦЕЛЬ ==================================================== Привести существующие текстовые secondary/ghost actions с серым фоном к единому стилю: btn-ghost-secondary Названия кнопок, data-* атрибуты, href, обработчики и назначение не менять. ==================================================== 1. css/styles.css ==================================================== Файл: css/styles.css Сейчас около существующих: .ghost { background: #eef2f7; color: #172033; } .ghost:hover { background: #e2e8f0; } добавить НОВЫЙ самостоятельный класс: .btn-ghost-secondary Использовать следующий стиль: .btn-ghost-secondary { display: inline-flex; align-items: center; justify-content: center; height: 36px; min-height: 36px; padding: 0 14px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #667085; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; } .btn-ghost-secondary:hover { background-color: #f2f4f7; color: #344054; } .btn-ghost-secondary:focus-visible { outline: 2px solid #9cc3ff; outline-offset: 2px; background-color: #eaecf0; } .btn-ghost-secondary:active { background-color: #e4e7ec; } .btn-ghost-secondary:disabled { opacity: .5; cursor: not-allowed; } ВАЖНО: Не изменять глобальный .ghost. Он остаётся для: - icon-only controls; - booking arrows; - copy buttons; - специальных компактных элементов. Новый класс применяется только к перечисленным ниже текстовым secondary actions. ==================================================== 2. js/auth.js ==================================================== Файл: js/auth.js ---------------------------------------------------- 2.1 twoFactorHtml() ---------------------------------------------------- Сейчас: <button type=\"button\" class=\"ghost\" data-2fa-cancel> Закрыть </button> Изменить на: class=\"ghost btn-ghost-secondary\" Текст: Закрыть оставить. ---------------------------------------------------- 2.2 authHtml() — register mode ---------------------------------------------------- В блоке: isRegister ? `<div class=\"auth-tabs\"> ...` есть кнопка: <button type=\"button\" class=\"ghost\" data-mode=\"login\"> Войти </button> Добавить: btn-ghost-secondary Итоговый класс: class=\"ghost btn-ghost-secondary\" Текст и data-mode не менять. ==================================================== 3. js/modules/clients.js ==================================================== Файл: js/modules/clients.js ---------------------------------------------------- 3.1 clientTable() ---------------------------------------------------- Кнопка имени клиента: <button type=\"button\" class=\"ghost\" data-open-client=\"...\" > должна получить: class=\"ghost btn-ghost-secondary\" ФИО и data-open-client сохранить. ---------------------------------------------------- 3.2 clientListMarkup() ---------------------------------------------------- Пагинация. Четыре варианта: Назад enabled Назад disabled Вперед enabled Вперед disabled Сейчас используются: class=\"ghost pagination-link\" или: class=\"ghost\" Добавить btn-ghost-secondary всем четырём. Например: class=\"ghost pagination-link btn-ghost-secondary\" и: class=\"ghost btn-ghost-secondary\" Тексты: Назад Вперед не менять. ---------------------------------------------------- 3.3 authLinkClientLabel() ---------------------------------------------------- Кнопка открытия клиента в списке сгенерированных ссылок: class=\"ghost\" → class=\"ghost btn-ghost-secondary\" ФИО и data-open-client не менять. ---------------------------------------------------- 3.4 clientAuthLinksList() ---------------------------------------------------- Текстовая кнопка: Удалить с: data-delete-auth-link сейчас имеет class=\"ghost\". Добавить: btn-ghost-secondary То есть: class=\"ghost btn-ghost-secondary\" Не менять delete-handler. ---------------------------------------------------- 3.5 НЕ МЕНЯТЬ В clients.js ---------------------------------------------------- НЕ переводить на новый стиль: - .copy-icon-button; - .client-delete-icon-button; - .client-delete-button; - .modal-close-icon. В частности кнопки копирования ссылки вида: class=\"ghost copy-icon-button\" оставить как есть. Они icon-only и имеют собственную геометрию 40x40. ==================================================== 4. js/modules/booking.js ==================================================== Файл: js/modules/booking.js Перевести только следующие ТЕКСТОВЫЕ ghost buttons. ---------------------------------------------------- 4.1 Удаление фотографии комментария ---------------------------------------------------- В service-image-previews: <button type=\"button\" class=\"ghost\" data-remove-booking-visit-photo > Удалить </button> Добавить: btn-ghost-secondary Название и handler сохранить. ---------------------------------------------------- 4.2 bookingSlotIntervalSettings() ---------------------------------------------------- Кнопка: Применить с: data-save-booking-slot-interval Добавить: btn-ghost-secondary. ---------------------------------------------------- 4.3 Основной toolbar календаря ---------------------------------------------------- Кнопка: Календарь с: data-booking-calendar-toggle Добавить: btn-ghost-secondary. ---------------------------------------------------- 4.4 НЕ МЕНЯТЬ в booking.js ---------------------------------------------------- Оставить прежними: - ‹ и › внутри booking-picker-head; - ‹ и › с data-booking-period-navigation; - booking-online-copy; - booking-grid-create; - booking-event-point; - booking-event-indicator; - booking-event-submenu-item; - calendar day buttons. Причина: это компактные icon/navigation/calendar controls, а не обычные secondary action buttons. Не применять к ним height/padding нового класса. ==================================================== 5. js/modules/settings.js ==================================================== Файл: js/modules/settings.js ---------------------------------------------------- 5.1 achievementConditionsFields() ---------------------------------------------------- Кнопка: Добавить условие с: data-add-achievement-condition Сейчас: class=\"ghost\" Изменить на: class=\"ghost btn-ghost-secondary\" ---------------------------------------------------- 5.2 user booking blocks ---------------------------------------------------- Кнопка: Добавить период с: data-add-user-booking-block Сейчас: class=\"ghost user-booking-block-add\" Изменить на: class=\"ghost user-booking-block-add btn-ghost-secondary\" ---------------------------------------------------- 5.3 product actual amount ---------------------------------------------------- Кнопка: Добавить склад с: data-add-product-amount Сейчас: class=\"ghost product-add-amount\" Изменить на: class=\"ghost product-add-amount btn-ghost-secondary\" ---------------------------------------------------- 5.4 Не менять ---------------------------------------------------- Не менять: - modal-close-icon; - delete icon buttons; - кнопки удаления; - Excel preview close icon; - service staff controls. ==================================================== 6. js/modules/finance.js ==================================================== Файл: js/modules/finance.js В этом модуле secondary actions используют class=\"secondary\". Сохранить существующий class secondary и ДОБАВИТЬ btn-ghost-secondary. Это важно для существующих finance-specific selectors/state styles. ---------------------------------------------------- 6.1 financeTableMarkup() ---------------------------------------------------- Кнопка общего плана: ${row.plan_enabled ? \"Убрать общий\" : \"Поставить общий\"} Сейчас: class=\"secondary finance-plan-toggle ...\" Сделать: class=\"secondary finance-plan-toggle btn-ghost-secondary ...\" Не менять .is-active. ---------------------------------------------------- 6.2 financeTableMarkup() ---------------------------------------------------- Кнопка индивидуального плана: Изменить индивидуальный или Создать индивидуальный Сейчас: class=\"secondary finance-individual-plan-button ...\" Добавить: btn-ghost-secondary Не менять динамический текст или .is-active. ---------------------------------------------------- 6.3 individualPlanModal() ---------------------------------------------------- Кнопка: + Добавить переменную data-finance-individual-add Добавить: btn-ghost-secondary. ---------------------------------------------------- 6.4 additionalPlanCardMarkup() ---------------------------------------------------- Кнопка: + Добавить переменную в план data-finance-additional-rule-add Добавить: btn-ghost-secondary. ---------------------------------------------------- 6.5 additionalPlansModal() ---------------------------------------------------- Кнопка: + Создать дополнительный план data-finance-additional-create Добавить: btn-ghost-secondary. ---------------------------------------------------- 6.6 finance() / finance-plan-head-actions ---------------------------------------------------- Кнопка: Дополнительные планы data-finance-additional-open Добавить: btn-ghost-secondary. ---------------------------------------------------- 6.7 Active finance states ---------------------------------------------------- НЕ удалять существующие CSS: .finance-plan-toggle.is-active .finance-individual-plan-button.is-active Их active-state должен продолжать иметь собственный цвет: - общий план — синий active state; - индивидуальный — фиолетовый active state. Проверить каскад после добавления btn-ghost-secondary. Если новый класс перекрывает active background, порядок CSS не перестраивать глобально. Использовать более специфичный существующий state selector так, чтобы .is-active оставался визуально главным. ---------------------------------------------------- 6.8 НЕ МЕНЯТЬ finance danger/buttons ---------------------------------------------------- Не менять: Удалить план client-delete-icon-button primary Save buttons Рассчитать Сохранить ставки Сохранить план Сохранить дополнительные планы ==================================================== 7. js/modules/loyalty.js ==================================================== Файл: js/modules/loyalty.js ---------------------------------------------------- 7.1 loyalty client search ---------------------------------------------------- Ссылка-кнопка: Сбросить Сейчас: <a class=\"ghost pagination-link\" ...> Сбросить </a> Добавить: btn-ghost-secondary Итог: class=\"ghost pagination-link btn-ghost-secondary\" href сохранить. ---------------------------------------------------- 7.2 loyalty pagination ---------------------------------------------------- Все варианты: Назад Вперед enabled <a> и disabled <button> получают btn-ghost-secondary. Сохранить: - href; - pagination-link; - disabled. ---------------------------------------------------- 7.3 rulesSection() ---------------------------------------------------- Кнопка: ${L.apply} с: data-apply-rule добавить: btn-ghost-secondary. ---------------------------------------------------- 7.4 rulesSection() ---------------------------------------------------- Кнопка: Применить ко всем с: data-apply-rule-all добавить: btn-ghost-secondary. ---------------------------------------------------- 7.5 НЕ МЕНЯТЬ loyalty controls ---------------------------------------------------- Не менять: - client-delete-button; - loyalty-rule-settings icon button; - modal-close-icon; - primary create/save actions. ==================================================== 8. ЧТО ЕЩЁ НЕ МЕНЯТЬ ==================================================== Я отдельно проверил следующие серые элементы — они НЕ относятся к этой миграции. Не менять: css/styles.css: - .catalog-excel-upload - .catalog-excel-export - .notification-channels-trigger - .booking-event-submenu-item - .event-row-create - .tabs - .tab-disabled Это: - label/a controls; - selectors; - event states; - navigation/tabs, а не обычные secondary action buttons. Также не менять: js/modules/catalog.js js/modules/notifications.js js/modules/tasks.js js/modules/onboarding.js js/modules/dashboard.js js/modules/breakdown.js Для этой задачи правок там не требуется. ==================================================== 9. ФАЙЛЫ, КОТОРЫЕ ДОЛЖНЫ БЫТЬ В DIFF ==================================================== Ожидаемые изменённые файлы: css/styles.css js/auth.js js/modules/clients.js js/modules/booking.js js/modules/settings.js js/modules/finance.js js/modules/loyalty.js Других файлов в diff быть не должно. ==================================================== 10. ЛОГИКА ==================================================== Не менять: - текст кнопок; - data-*; - href; - disabled; - onclick/event delegation; - API; - состояние; - бизнес-логику; - backend; - js/api.js. Разрешены только: 1. новый CSS-класс; 2. добавление этого CSS-класса перечисленным controls; 3. минимальная CSS-коррекция finance .is-active, только если она нужна для сохранения существующего active-state. ==================================================== 11. ПРОВЕРКИ ==================================================== Выполнить: git diff --check node --check js/auth.js node --check js/modules/clients.js node --check js/modules/booking.js node --check js/modules/settings.js node --check js/modules/finance.js node --check js/modules/loyalty.js Дополнительно проверить через rg: - btn-ghost-secondary присутствует только в согласованных местах; - data-* атрибуты не менялись; - тексты controls не менялись; - copy-icon-button не получил btn-ghost-secondary; - modal-close-icon не получил btn-ghost-secondary; - client-delete-button/client-delete-icon-button не получили btn-ghost-secondary; - primary buttons не получили btn-ghost-secondary. ==================================================== 12. COMMIT ==================================================== После проверок: commit push в frontend-export Вернуть: TASK_RESULT Branch: Commit: Changed files: Изменённые controls по файлам: - auth.js: - clients.js: - booking.js: - settings.js: - finance.js: - loyalty.js: CSS: - btn-ghost-secondary: Сохранённые специальные controls: - icon-only: - danger: - finance active states: Tests: - git diff --check: - node --check: git diff --stat: После этого ОСТАНОВИТЬСЯ. Следующие решения принимает архитектор/reviewer."
