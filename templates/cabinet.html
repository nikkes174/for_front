<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#1051;&#1080;&#1095;&#1085;&#1099;&#1081; &#1082;&#1072;&#1073;&#1080;&#1085;&#1077;&#1090;</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/cabinet.css" />
  </head>
  <body>
    <main class="cabinet-shell">
      <aside class="cabinet-sidebar" aria-label="&#1056;&#1072;&#1079;&#1076;&#1077;&#1083;&#1099; &#1083;&#1080;&#1095;&#1085;&#1086;&#1075;&#1086; &#1082;&#1072;&#1073;&#1080;&#1085;&#1077;&#1090;&#1072;">
        <a class="cabinet-nav-link active" href="#my-data" data-cabinet-tab="profile">&#1052;&#1086;&#1080; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;</a>
        <button type="button" class="cabinet-logout" data-cabinet-logout>&#1042;&#1099;&#1093;&#1086;&#1076;</button>
      </aside>

      <section class="cabinet-content">
        <div class="cabinet-panel" data-cabinet-view="profile">
          <div class="cabinet-heading">
            <p>&#1051;&#1080;&#1095;&#1085;&#1099;&#1081; &#1082;&#1072;&#1073;&#1080;&#1085;&#1077;&#1090;</p>
            <h1 data-cabinet-title>&#1052;&#1086;&#1080; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;</h1>
          </div>

          <form class="profile-form" data-cabinet-form>
            <label class="field" data-cabinet-field="last_name"><span>&#1060;&#1072;&#1084;&#1080;&#1083;&#1080;&#1103; *</span><input name="last_name" type="text" required autocomplete="family-name" /></label>
            <label class="field" data-cabinet-field="first_name"><span>&#1048;&#1084;&#1103; *</span><input name="first_name" type="text" required autocomplete="given-name" /></label>
            <label class="field" data-cabinet-field="middle_name"><span>&#1054;&#1090;&#1095;&#1077;&#1089;&#1090;&#1074;&#1086;</span><input name="middle_name" type="text" autocomplete="additional-name" /></label>
            <label class="field" data-cabinet-field="phone"><span>&#1053;&#1086;&#1084;&#1077;&#1088; &#1090;&#1077;&#1083;&#1077;&#1092;&#1086;&#1085;&#1072; *</span><input name="phone" type="tel" required autocomplete="tel" /></label>
            <label class="field" data-cabinet-field="gender"><span>&#1055;&#1086;&#1083; *</span><select name="gender" required><option value="">&#1042;&#1099;&#1073;&#1077;&#1088;&#1080;&#1090;&#1077; &#1087;&#1086;&#1083;</option><option value="male">&#1052;&#1091;&#1078;&#1089;&#1082;&#1086;&#1081;</option><option value="female">&#1046;&#1077;&#1085;&#1089;&#1082;&#1080;&#1081;</option></select></label>
            <label class="field" data-cabinet-field="telegram_id"><span>Telegram ID</span><input name="telegram_id" type="text" inputmode="numeric" /></label>
            <label class="field" data-cabinet-field="max_id"><span>Max ID</span><input name="max_id" type="text" inputmode="numeric" /></label>
            <label class="field" data-cabinet-field="vk_id"><span>VK ID</span><input name="vk_id" type="text" inputmode="numeric" /></label>
            <label class="field wide" data-cabinet-field="email"><span>Email</span><input name="email" type="email" autocomplete="email" /></label>
            <p class="cabinet-message" data-cabinet-message></p>
            <div class="form-actions"><button type="submit" data-cabinet-submit>&#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;</button></div>
          </form>
          <section data-cabinet-history-section>
            <h2 class="cabinet-subtitle">&#1048;&#1089;&#1090;&#1086;&#1088;&#1080;&#1103;</h2>
            <div class="cabinet-history-list" data-cabinet-history></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("[data-cabinet-form]");
      const message = document.querySelector("[data-cabinet-message]");
      const historyList = document.querySelector("[data-cabinet-history]");
      const historySection = document.querySelector("[data-cabinet-history-section]");
      const cabinetTitle = document.querySelector("[data-cabinet-title]");
      const token = new URLSearchParams(window.location.search).get("token");
      const submitButton = form.querySelector("button");
      const defaultRegistrationFields = ["last_name", "first_name", "middle_name", "phone", "gender", "telegram_id", "max_id", "vk_id", "email"];
      const defaultCardSections = ["client_name", "bonus_cashback", "client_level", "client_visits", "client_chat"];
      let currentCardSections = defaultCardSections;
      let currentClient = null;
      let cabinetData = null;
      let selectedVisit = null;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }

      function sectionTitle(section) {
        if (section === "client_name") return "\u0424\u0418\u041e";
        if (section === "client_level") return "\u0423\u0440\u043e\u0432\u0435\u043d\u044c";
        if (section === "client_visits") return "\u0418\u0441\u0442\u043e\u0440\u0438\u044f \u0432\u0438\u0437\u0438\u0442\u043e\u0432";
        if (section === "client_chat") return "\u0427\u0430\u0442";
        if (section.startsWith("bonus_")) return bonusName(section);
        return section;
      }

      function clientName(client) {
        return client?.full_name || [client?.last_name, client?.first_name, client?.middle_name].filter(Boolean).join(" ") || "\u041a\u043b\u0438\u0435\u043d\u0442";
      }

      function money(value) {
        const amount = Number(value || 0);
        return Number.isFinite(amount) ? amount.toLocaleString("ru-RU", { maximumFractionDigits: 2 }) : String(value || 0);
      }

      function dateTime(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("ru-RU");
      }

      function visitStatus(status) {
        const labels = {
          completed: "\u0417\u0430\u0432\u0435\u0440\u0448\u0451\u043d",
          scheduled: "\u0417\u0430\u043f\u043b\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u043d",
          cancelled: "\u041e\u0442\u043c\u0435\u043d\u0451\u043d",
          no_show: "\u041d\u0435 \u043f\u0440\u0438\u0448\u0451\u043b",
        };
        return labels[status] || status || "-";
      }

      function bonusName(section) {
        const code = section.replace(/^bonus_/, "") || "cashback";
        if (code === "cashback") return "\u041a\u0435\u0448\u0431\u044d\u043a";
        const type = (cabinetData?.bonus_types || []).find((item) => item.code === code);
        return type?.name || code;
      }

      function visitItemName(item, kind) {
        const nested = item.service || item.product || item.good || item.item || {};
        const name = item.title || item.name || item.service_name || item.product_name || item.good_title || nested.title || nested.name;
        if (name) return name;
        const id = item.service_id || item.product_id || item.good_id || item.id;
        return id ? `${kind} #${id}` : "-";
      }

      function parseVisitComment(value) {
        const lines = String(value || "").split("\n");
        const meta = { serviceNames: "", productNames: "", comment: "" };
        const commentLines = [];
        for (const line of lines) {
          if (line.startsWith("__services:")) meta.serviceNames = line.slice("__services:".length).trim();
          else if (line.startsWith("__products:")) meta.productNames = line.slice("__products:".length).trim();
          else commentLines.push(line);
        }
        meta.comment = commentLines.join("\n").trim();
        return meta;
      }

      function visitItems(items, emptyText, kind) {
        const list = Array.isArray(items) ? items : [];
        if (!list.length) return `<p class="cabinet-history-empty">${escapeHtml(emptyText)}</p>`;
        return `<ul class="cabinet-visit-items">${list.map((item) => `<li>${escapeHtml(visitItemName(item, kind))}</li>`).join("")}</ul>`;
      }

      function visitModal() {
        const selected = selectedVisit;
        if (!selected) return "";
        const visit = selected.visit || selected;
        const parsed = parseVisitComment(visit.comment);
        const services = (selected.services || visit.yclients_services || []).length
          ? (selected.services || visit.yclients_services || [])
          : (parsed.serviceNames ? parsed.serviceNames.split(",").map((name) => ({ name: name.trim() })).filter((item) => item.name) : []);
        const products = (selected.products || visit.yclients_goods_transactions || []).length
          ? (selected.products || visit.yclients_goods_transactions || [])
          : (parsed.productNames ? parsed.productNames.split(",").map((name) => ({ name: name.trim() })).filter((item) => item.name) : []);
        return `
          <div class="modal-backdrop" data-cabinet-visit-modal>
            <div class="modal-card">
              <div class="modal-head">
                <h3>\u0412\u0438\u0437\u0438\u0442</h3>
                <button type="button" class="ghost" data-cabinet-close-visit>\u0417\u0430\u043a\u0440\u044b\u0442\u044c</button>
              </div>
              <div class="modal-grid">
                <div class="readonly-field"><span>\u0414\u0430\u0442\u0430 \u0438 \u0432\u0440\u0435\u043c\u044f</span><b>${escapeHtml(dateTime(visit.visit_at || visit.created_at) || "-")}</b></div>
                <div class="readonly-field"><span>\u0421\u0442\u0430\u0442\u0443\u0441 \u0432\u0438\u0437\u0438\u0442\u0430</span><b>${escapeHtml(visitStatus(visit.visit_status || visit.attendance_title))}</b></div>
                <div class="readonly-field"><span>\u0424\u0438\u043b\u0438\u0430\u043b</span><b>${escapeHtml(visit.branch_id || "-")}</b></div>
                <div class="readonly-field"><span>\u041c\u0430\u0441\u0442\u0435\u0440</span><b>${escapeHtml(visit.employee_id || "-")}</b></div>
                <div class="readonly-field"><span>\u0423\u0441\u043b\u0443\u0433\u0438</span>${visitItems(services, "\u0423\u0441\u043b\u0443\u0433 \u043d\u0435\u0442", "\u0423\u0441\u043b\u0443\u0433\u0430")}</div>
                <div class="readonly-field"><span>\u0422\u043e\u0432\u0430\u0440\u044b</span>${visitItems(products, "\u0422\u043e\u0432\u0430\u0440\u043e\u0432 \u043d\u0435\u0442", "\u0422\u043e\u0432\u0430\u0440")}</div>
                <div class="readonly-field"><span>\u0421\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c</span><b>${escapeHtml(money(visit.total_cost))}</b></div>
                <div class="readonly-field"><span>\u0421\u043a\u0438\u0434\u043a\u0430</span><b>${escapeHtml(money(visit.discount_amount))}</b></div>
                <div class="readonly-field"><span>\u041e\u043f\u043b\u0430\u0447\u0435\u043d\u043e</span><b>${escapeHtml(money(visit.paid_amount))}</b></div>
              </div>
            </div>
          </div>
        `;
      }

      function sectionBody(section) {
        const client = cabinetData?.client || currentClient;
        if (section === "client_name") return `<b>${escapeHtml(clientName(client))}</b>`;
        if (section === "client_level") {
          const level = client?.client_level || cabinetData?.metric?.client_level || cabinetData?.metric?.loyalty_level || "\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d";
          return `<b>${escapeHtml(level)}</b>`;
        }
        if (section === "client_visits") {
          const visits = cabinetData?.visits || [];
          if (!visits.length) return `<p class="cabinet-history-empty">\u0412\u0438\u0437\u0438\u0442\u043e\u0432 \u043f\u043e\u043a\u0430 \u043d\u0435\u0442.</p>`;
          return `
            <div class="cabinet-visit-list">
              ${visits.slice(0, 10).map((item) => {
                const visit = item.visit || item;
                return `<button type="button" class="cabinet-visit-button" data-cabinet-visit="${escapeHtml(visit.id)}"><b>${escapeHtml(dateTime(visit.visit_at || visit.created_at) || "\u0414\u0430\u0442\u0430 \u043d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u0430")}</b><span>${escapeHtml(visitStatus(visit.visit_status || visit.source))}</span></button>`;
              }).join("")}
            </div>
          `;
        }
        if (section === "client_chat") return `<p class="cabinet-history-empty">\u0427\u0430\u0442 \u043f\u043e\u043a\u0430 \u043d\u0435 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d.</p>`;
        if (section.startsWith("bonus_")) {
          const code = section.replace(/^bonus_/, "") || "cashback";
          const balance = (cabinetData?.bonus_balances || []).find((item) => (item.bonus_type || "cashback") === code);
          return `<b>${escapeHtml(money(balance?.balance || 0))}</b><span>\u0431\u0430\u043b\u043b\u043e\u0432</span>`;
        }
        return "";
      }

      function renderHistorySections(sections) {
        const enabled = Array.isArray(sections) ? sections : defaultCardSections;
        currentCardSections = enabled;
        if (!enabled.length) {
          historyList.innerHTML = '<p class="cabinet-history-empty">\u0414\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u043a\u043b\u0438\u0435\u043d\u0442\u0430 \u0440\u0430\u0437\u0434\u0435\u043b\u044b \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u044b.</p>';
          return;
        }
        historyList.innerHTML = enabled.map((section) => `
          <article class="cabinet-history-card">
            <span>${escapeHtml(sectionTitle(section))}</span>
            <div class="cabinet-history-body">${sectionBody(section)}</div>
          </article>
        `).join("");
        historyList.insertAdjacentHTML("beforeend", visitModal());
      }

      function setCabinetTab(tab) {
        document.querySelectorAll("[data-cabinet-tab]").forEach((link) => link.classList.toggle("active", link.dataset.cabinetTab === tab));
        document.querySelectorAll("[data-cabinet-view]").forEach((view) => {
          view.hidden = view.dataset.cabinetView !== tab;
        });
      }

      function setRegistrationMode(enabled) {
        if (cabinetTitle) cabinetTitle.textContent = enabled ? "\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0430" : "\u041c\u043e\u0438 \u0434\u0430\u043d\u043d\u044b\u0435";
        if (historySection) historySection.hidden = enabled;
        submitButton.textContent = enabled ? "\u0417\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c\u0441\u044f" : "\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0434\u0430\u043d\u043d\u044b\u0435";
      }

      function applyRegistrationFields(fields) {
        const enabled = Array.isArray(fields) ? fields : defaultRegistrationFields;
        const fieldsByName = new Map([...form.querySelectorAll("[data-cabinet-field]")].map((field) => [field.dataset.cabinetField, field]));
        const order = [...enabled, ...defaultRegistrationFields.filter((name) => !enabled.includes(name))];
        order.forEach((name) => {
          const field = fieldsByName.get(name);
          if (field) form.insertBefore(field, form.querySelector("[data-cabinet-message]"));
        });
        fieldsByName.forEach((field) => {
          const isVisible = enabled.includes(field.dataset.cabinetField);
          field.hidden = !isVisible;
          field.style.display = isVisible ? "" : "none";
          field.querySelectorAll("input, select, textarea").forEach((control) => {
            control.disabled = !isVisible;
            if (!isVisible) control.required = false;
          });
        });
      }

      function textValue(data, name) {
        return String(data[name] || "").trim();
      }

      function optionalNumber(value) {
        const trimmed = String(value || "").trim();
        return trimmed ? Number(trimmed) : null;
      }

      function setMessage(text, kind = "") {
        message.textContent = text;
        message.dataset.kind = kind;
      }
      function fillCurrentUserCabinet(user) {
        const values = {
          last_name: user.last_name || "",
          first_name: user.first_name || "",
          middle_name: user.middle_name || "",
          phone: user.phone || user.primary_phone || "",
          gender: user.gender || "",
          telegram_id: user.telegram_id || "",
          max_id: user.max_id || "",
          vk_id: user.vk_id || "",
          email: user.email || "",
        };
        Object.entries(values).forEach(([name, value]) => {
          const control = form.elements[name];
          if (control) control.value = value;
        });
      }

      async function consumeLink() {
        applyRegistrationFields([]);
        renderHistorySections([]);
        setRegistrationMode(false);
        if (!token) {
          try {
            const response = await fetch("/auth/me");
            if (!response.ok) throw new Error();
            const result = await response.json();
            const cabinetResponse = await fetch("/auth/cabinet");
            cabinetData = cabinetResponse.ok ? await cabinetResponse.json() : null;
            currentClient = cabinetData?.client || null;
            applyRegistrationFields(cabinetData?.registration_fields);
            fillCurrentUserCabinet(currentClient || result);
            renderHistorySections(cabinetData?.card_sections ?? defaultCardSections);
            setMessage("", "");
          } catch {
            setMessage("\u0421\u0435\u0441\u0441\u0438\u044f \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\u0430. \u0412\u043e\u0439\u0434\u0438\u0442\u0435 \u0441\u043d\u043e\u0432\u0430.", "error");
          }
          submitButton.disabled = true;
          return;
        }
        submitButton.disabled = true;
        try {
          const response = await fetch(`/auth/client-auth-links/${encodeURIComponent(token)}/consume`, { method: "POST" });
          if (!response.ok) throw new Error();
          const link = await response.json();
          cabinetData = link;
          currentClient = link.client || link.profile || null;
          setRegistrationMode(!link.client_id);
          applyRegistrationFields(link.registration_fields);
          fillCurrentUserCabinet(currentClient || {});
          renderHistorySections(link.card_sections);
          submitButton.disabled = false;
        } catch {
          const text = "\u0421\u0441\u044b\u043b\u043a\u0430 \u043d\u0435\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u0430 \u0438\u043b\u0438 \u0443\u0436\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0430.";
          alert(text);
          setMessage(text, "error");
          document.querySelector(".cabinet-shell")?.setAttribute("hidden", "");
          location.replace("/auth.html");
        }
      }

      document.querySelectorAll("[data-cabinet-tab]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          setCabinetTab(link.dataset.cabinetTab);
        });
      });

      document.addEventListener("click", async (event) => {
        const visitButton = event.target.closest("[data-cabinet-visit]");
        if (visitButton) {
          selectedVisit = (cabinetData?.visits || []).find((item) => String((item.visit || item).id) === String(visitButton.dataset.cabinetVisit)) || null;
          renderHistorySections(currentCardSections);
          return;
        }

        if (event.target.closest("[data-cabinet-close-visit]") || event.target.matches("[data-cabinet-visit-modal]")) {
          selectedVisit = null;
          renderHistorySections(currentCardSections);
          return;
        }

        if (event.target.closest("[data-cabinet-logout]")) {
          await fetch("/auth/logout", { method: "POST" }).catch(() => null);
          location.href = "/auth.html?mode=login";
        }
      });

      setCabinetTab("profile");
      consumeLink();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!token) return;

        const data = Object.fromEntries(new FormData(form).entries());
        const body = {
          last_name: textValue(data, "last_name") || null,
          first_name: textValue(data, "first_name") || null,
          middle_name: textValue(data, "middle_name") || null,
          phone: textValue(data, "phone") || null,
          gender: textValue(data, "gender") || null,
          telegram_id: optionalNumber(data.telegram_id),
          max_id: optionalNumber(data.max_id),
          vk_id: optionalNumber(data.vk_id),
          email: textValue(data, "email") || null,
        };

        submitButton.disabled = true;
        setMessage("\u0421\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u043c \u0434\u0430\u043d\u043d\u044b\u0435...");

        try {
          const response = await fetch(`/public-api/client-auth-links/${encodeURIComponent(token)}/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0434\u0430\u043d\u043d\u044b\u0435");
          }
          const result = await response.json();
          if (result.redirect_url) {
            location.href = result.redirect_url;
            return;
          }
          currentClient = result.client || null;
          renderHistorySections(currentCardSections);
          setMessage("\u0414\u0430\u043d\u043d\u044b\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u044b.", "success");
        } catch (error) {
          setMessage(error.message, "error");
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
