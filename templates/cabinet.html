<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="stylesheet" href="/css/cabinet.css" />

  <body>
    <main class="cabinet-shell">
      <section class="cabinet-content">
        <div class="cabinet-topbar">
          <button type="button" class="cabinet-menu-button" data-cabinet-menu-open aria-label="Меню">
            <span></span><span></span><span></span>
          </button>
          <button type="button" class="cabinet-notifications-button" data-cabinet-notifications-open aria-label="Уведомления">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </button>
        </div>
        <div class="cabinet-panel" data-cabinet-view="profile">
          <div class="cabinet-heading">
            <p>&#1051;&#1080;&#1095;&#1085;&#1099;&#1081; &#1082;&#1072;&#1073;&#1080;&#1085;&#1077;&#1090;</p>
            <div class="cabinet-title-row"><h1 data-cabinet-title>&#1052;&#1086;&#1080; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;</h1><button type="button" class="cabinet-edit-button" data-cabinet-edit aria-label="&#1048;&#1079;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;" title="&#1048;&#1079;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100;">&#9998;</button></div>
          </div>

          <form class="profile-form" data-cabinet-form>
            <label class="field" data-cabinet-field="last_name"><span>&#1060;&#1072;&#1084;&#1080;&#1083;&#1080;&#1103; *</span><input name="last_name" type="text" required autocomplete="family-name" disabled /></label>
            <label class="field" data-cabinet-field="first_name"><span>&#1048;&#1084;&#1103; *</span><input name="first_name" type="text" required autocomplete="given-name" disabled /></label>
            <label class="field" data-cabinet-field="middle_name"><span>&#1054;&#1090;&#1095;&#1077;&#1089;&#1090;&#1074;&#1086;</span><input name="middle_name" type="text" autocomplete="additional-name" disabled /></label>
            <label class="field" data-cabinet-field="phone"><span>&#1053;&#1086;&#1084;&#1077;&#1088; &#1090;&#1077;&#1083;&#1077;&#1092;&#1086;&#1085;&#1072; *</span><input name="phone" type="tel" required autocomplete="tel" disabled /></label>
            <label class="field" data-cabinet-field="gender"><span>&#1055;&#1086;&#1083; *</span><select name="gender" required disabled><option value="">&#1042;&#1099;&#1073;&#1077;&#1080;&#1090;&#1077; &#1087;&#1086;&#1083;</option><option value="male">&#1052;&#1091;&#1078;&#1089;&#1082;&#1086;&#1081;</option><option value="female">&#1046;&#1077;&#1085;&#1089;&#1082;&#1080;&#1081;</option></select></label>
            <label class="field" data-cabinet-field="telegram_id" hidden><span>Telegram ID</span><input name="telegram_id" type="text" inputmode="numeric" disabled /></label>
            <label class="field" data-cabinet-field="max_id" hidden><span>Max ID</span><input name="max_id" type="text" inputmode="numeric" disabled /></label>
            <label class="field" data-cabinet-field="vk_id" hidden><span>VK ID</span><input name="vk_id" type="text" inputmode="numeric" disabled /></label>
            <label class="field wide" data-cabinet-field="email"><span>Email</span><input name="email" type="email" autocomplete="email" disabled /></label>
            <p class="cabinet-message" data-cabinet-message></p>
            <div class="form-actions" data-cabinet-actions hidden><button type="submit" data-cabinet-submit>&#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100; &#1076;&#1072;&#1085;&#1085;&#1099;&#1077;</button></div>
          </form>
          <section data-cabinet-history-section>
            <h2 class="cabinet-subtitle">&#1048;&#1089;&#1090;&#1086;&#1088;&#1080;&#1103;</h2>
            <div class="cabinet-history-list" data-cabinet-history></div>
          </section>
        </div>
        <div class="cabinet-panel" data-cabinet-view="achievements" hidden>
          <div class="cabinet-heading"><p>Личный кабинет</p><h1>Мои достижения</h1></div>
          <div class="cabinet-achievements-list" data-cabinet-achievements></div>
        </div>
      </section>
    </main>
    <div class="modal-backdrop cabinet-menu-backdrop" data-cabinet-menu hidden>
      <aside class="cabinet-drawer" aria-label="Меню личного кабинета">
        <div class="cabinet-drawer-head">
          <strong>Кабинет</strong>
          <button type="button" class="cabinet-drawer-close" data-cabinet-menu-close aria-label="Закрыть">×</button>
        </div>
        <nav class="cabinet-drawer-nav">
          <a class="cabinet-nav-link active" href="#my-data" data-cabinet-tab="profile">Мои данные</a>
          <a class="cabinet-nav-link" href="#achievements" data-cabinet-tab="achievements">Мои достижения</a>
          <button type="button" class="cabinet-logout" data-cabinet-logout>Выход</button>
        </nav>
      </aside>
    </div>
    <div class="modal-backdrop" data-cabinet-notifications-modal hidden>
      <div class="modal-card cabinet-notifications-modal">
        <div class="modal-head">
          <h3>Уведомления</h3>
          <button type="button" class="ghost" data-cabinet-notifications-close>Закрыть</button>
        </div>
        <label class="cabinet-notifications-toggle">
          <span class="cabinet-notifications-toggle-text">Получать уведомления</span>
          <span class="cabinet-switch">
            <input type="checkbox" data-cabinet-push-toggle />
            <span class="cabinet-switch-track" aria-hidden="true"></span>
          </span>
        </label>
        <p class="cabinet-message" data-cabinet-push-status></p>
        <div class="cabinet-notifications-empty" data-cabinet-notifications-list>Уведомлений пока нет.</div>
      </div>
    </div>
    <div class="modal-backdrop" data-cabinet-achievement-modal hidden>
      <div class="modal-card cabinet-achievement-modal">
        <div class="modal-head">
          <h3>Достижение</h3>
          <button type="button" class="ghost" data-cabinet-achievement-close>Закрыть</button>
        </div>
        <div data-cabinet-achievement-content></div>
      </div>
    </div>

    <script type="module" src="/js/dom.js"></script>
    <script>
      const form = document.querySelector("[data-cabinet-form]");
      const message = document.querySelector("[data-cabinet-message]");
      const historyList = document.querySelector("[data-cabinet-history]");
      const historySection = document.querySelector("[data-cabinet-history-section]");
      const cabinetTitle = document.querySelector("[data-cabinet-title]");
      const notificationsModal = document.querySelector("[data-cabinet-notifications-modal]");
      const pushToggleControl = document.querySelector(".cabinet-notifications-toggle");
      const pushToggle = document.querySelector("[data-cabinet-push-toggle]");
      const pushStatus = document.querySelector("[data-cabinet-push-status]");
      const notificationsList = document.querySelector("[data-cabinet-notifications-list]");
      const achievementsList = document.querySelector("[data-cabinet-achievements]");
      const achievementModal = document.querySelector("[data-cabinet-achievement-modal]");
      const achievementContent = document.querySelector("[data-cabinet-achievement-content]");
      const token = new URLSearchParams(window.location.search).get("token");
      const submitButton = form.querySelector("button");
      const defaultRegistrationFields = ["last_name", "first_name", "middle_name", "phone", "gender", "email"];
      const defaultCardSections = ["client_name", "bonus_cashback", "client_level", "client_visits", "client_chat"];
      let currentCardSections = defaultCardSections;
      let currentClient = null;
      let cabinetData = null;
      let selectedVisit = null;
      const SESSION_TOKEN_KEY = "loyalty.sessionToken";
      const CABINET_NOTIFICATIONS_SEEN_KEY = "cabinetNotificationsSeenAt";

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch(() => null);
        });
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }

      function pushContext() {
        const client = cabinetData?.client || currentClient || {};
        return { organizationId: cabinetData?.organization_id || client.organization_id, clientId: client.id || cabinetData?.client_id };
      }

      function base64ToUint8Array(value) {
        const padding = "=".repeat((4 - value.length % 4) % 4);
        const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
        return Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));
      }

      async function requestJson(path, options = {}) {
        const response = await fetch(path, {
          credentials: "include",
          cache: options.cache || "default",
          headers: options.body ? { "Content-Type": "application/json", ...options.headers } : options.headers,
          ...options,
        });
        if (!response.ok) throw new Error("Не удалось обновить уведомления");
        return response.json();
      }

      async function restoreStoredSession() {
        const token = localStorage.getItem(SESSION_TOKEN_KEY);
        if (!token) return null;
        try {
          const result = await requestJson("/auth/session/restore", {
            method: "POST",
            body: JSON.stringify({ token }),
          });
          if (result?.session_token) localStorage.setItem(SESSION_TOKEN_KEY, result.session_token);
          return result?.user || null;
        } catch {
          localStorage.removeItem(SESSION_TOKEN_KEY);
          return null;
        }
      }

      async function currentUser() {
        const response = await fetch("/auth/me");
        if (response.ok) return response.json();
        return restoreStoredSession();
      }

      async function refreshPushState() {
        const { organizationId, clientId } = pushContext();
        if (!organizationId || !clientId) {
          pushToggle.disabled = true;
          pushStatus.textContent = "Клиент не найден.";
          return null;
        }
        const registration = "serviceWorker" in navigator ? await navigator.serviceWorker.register("/service-worker.js").catch(() => null) : null;
        const subscription = await registration?.pushManager?.getSubscription?.();
        const endpoint = subscription?.endpoint ? `&endpoint=${encodeURIComponent(subscription.endpoint)}` : "";
        const state = await requestJson(`/crm-api/client-communications/push/status?organization_id=${organizationId}&client_id=${clientId}${endpoint}`, { cache: "no-store" });
        pushToggle.checked = !!state.enabled;
        pushToggle.disabled = !state.configured;
        pushStatus.textContent = state.configured ? "" : "Push-ключи VAPID не настроены на сервере.";
        return state;
      }

      function formatDateTime(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : date.toLocaleString("ru-RU");
      }

      function notificationStamp(item) {
        return String(item?.sent_at || item?.created_at || item?.id || "");
      }

      function linkifyText(value) {
        const text = String(value ?? "");
        const pattern = /https?:\/\/[^\s<>"']+/g;
        let html = "";
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(text))) {
          const url = match[0];
          html += escapeHtml(text.slice(lastIndex, match.index));
          html += `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`;
          lastIndex = match.index + url.length;
        }
        return html + escapeHtml(text.slice(lastIndex));
      }

      function notificationTitle(item) {
        return String(item?.message_title || item?.message_text || "Уведомление").trim().slice(0, 120) || "Уведомление";
      }

      function notificationsSeenKey(clientId) {
        return `${CABINET_NOTIFICATIONS_SEEN_KEY}:${clientId || "unknown"}`;
      }

      function setNotificationBadge(hasUnread) {
        document.querySelector("[data-cabinet-notifications-open]")?.classList.toggle("has-unread", !!hasUnread);
      }

      async function refreshNotificationsList({ markSeen = false } = {}) {
        const { clientId } = pushContext();
        if (!clientId) return;
        const messages = await requestJson(`/crm-api/client-communications/clients/${clientId}/messages?channel=push&message_type=notification&limit=20`, { cache: "no-store" });
        if (!messages.length) {
          notificationsList.textContent = "Уведомлений пока нет.";
          setNotificationBadge(false);
          return;
        }
        const latestStamp = notificationStamp(messages[0]);
        const seenKey = notificationsSeenKey(clientId);
        const seenStamp = localStorage.getItem(seenKey) || "";
        setNotificationBadge(Boolean(latestStamp && latestStamp !== seenStamp));
        notificationsList.innerHTML = messages.map((item) => `
          <details class="cabinet-notification-item">
            <summary>${escapeHtml(notificationTitle(item))}</summary>
            <div>${linkifyText(item.message_text || "")}</div>
            <small>${escapeHtml(formatDateTime(item.sent_at || item.created_at))}</small>
          </details>
        `).join("");
        if (markSeen) {
          localStorage.setItem(seenKey, latestStamp);
          setNotificationBadge(false);
        }
      }

      async function enablePushNotifications() {
        const { organizationId, clientId } = pushContext();
        await requestJson("/crm-api/client-communications/push/preference", {
          method: "POST",
          body: JSON.stringify({ organization_id: organizationId, client_id: clientId, enabled: true }),
        });
        if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
          pushStatus.textContent = "Уведомления включены.";
          pushToggle.checked = true;
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          pushStatus.textContent = `Разрешение на уведомления не выдано: ${permission}.`;
          return;
        }
        try {
          const state = await requestJson(`/crm-api/client-communications/push/status?organization_id=${organizationId}&client_id=${clientId}`, { cache: "no-store" });
          if (!state?.public_key) throw new Error("Push-ключи VAPID не настроены на сервере.");
          const registration = await navigator.serviceWorker.register("/service-worker.js");
          const subscription = await registration.pushManager.getSubscription() || await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToUint8Array(state.public_key),
          });
          await requestJson("/crm-api/client-communications/push/subscribe", {
            method: "POST",
            body: JSON.stringify({
              organization_id: organizationId,
              client_id: clientId,
              endpoint: subscription.endpoint,
              keys: subscription.toJSON().keys,
              platform: navigator.platform || "",
              user_agent: navigator.userAgent || "",
            }),
          });
          pushStatus.textContent = "Уведомления включены.";
        } catch (error) {
          pushStatus.textContent = error.message || "Состояние сохранено, push-подписка не создана.";
        }
        pushToggle.checked = true;
      }

      async function disablePushNotifications() {
        const { organizationId, clientId } = pushContext();
        await requestJson("/crm-api/client-communications/push/preference", {
          method: "POST",
          body: JSON.stringify({ organization_id: organizationId, client_id: clientId, enabled: false }),
        });
        const registration = await navigator.serviceWorker.ready.catch(() => null);
        const subscription = await registration?.pushManager.getSubscription();
        if (subscription) {
          await requestJson("/crm-api/client-communications/push/subscribe", {
            method: "DELETE",
            body: JSON.stringify({ endpoint: subscription.endpoint }),
          }).catch(() => null);
          await subscription.unsubscribe().catch(() => null);
        }
        pushToggle.checked = false;
        pushStatus.textContent = "Уведомления выключены.";
      }

      function sectionTitle(section) {
        if (section === "client_name") return "\u0424\u0418\u041e";
        if (section === "client_level") return "\u0423\u0440\u043e\u0432\u0435\u043d\u044c";
        if (section === "client_visits") return "\u0418\u0441\u0442\u043e\u0440\u0438\u044f \u0432\u0438\u0437\u0438\u0442\u043e\u0432";
        if (section === "client_chat") return "\u0427\u0430\u0442";
        if (section.startsWith("bonus_")) return bonusName(section);
        return section;
      }

      function clientName(client) {
        return client?.full_name || [client?.last_name, client?.first_name, client?.middle_name].filter(Boolean).join(" ") || "\u041a\u043b\u0438\u0435\u043d\u0442";
      }

      function money(value) {
        const amount = Number(value || 0);
        return Number.isFinite(amount) ? amount.toLocaleString("ru-RU", { maximumFractionDigits: 2 }) : String(value || 0);
      }

      function dateTime(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("ru-RU");
      }

      function visitStatus(status) {
        const labels = {
          completed: "\u0417\u0430\u0432\u0435\u0440\u0448\u0451\u043d",
          scheduled: "\u0417\u0430\u043f\u043b\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u043d",
          cancelled: "\u041e\u0442\u043c\u0435\u043d\u0451\u043d",
          no_show: "\u041d\u0435 \u043f\u0440\u0438\u0448\u0451\u043b",
        };
        return labels[status] || status || "-";
      }

      function bonusName(section) {
        const code = section.replace(/^bonus_/, "") || "cashback";
        if (code === "cashback") return "\u041a\u0435\u0448\u0431\u044d\u043a";
        const type = (cabinetData?.bonus_types || []).find((item) => item.code === code);
        return type?.name || code;
      }

      function visitItemName(item, kind) {
        const nested = item.service || item.product || item.good || item.item || {};
        const name = item.title || item.name || item.service_name || item.product_name || item.good_title || nested.title || nested.name;
        if (name) return name;
        const id = item.service_id || item.product_id || item.good_id || item.id;
        return id ? `${kind} #${id}` : "-";
      }

      function parseVisitComment(value) {
        const lines = String(value || "").split("\n");
        const meta = { serviceNames: "", productNames: "", comment: "" };
        const commentLines = [];
        for (const line of lines) {
          if (line.startsWith("__services:")) meta.serviceNames = line.slice("__services:".length).trim();
          else if (line.startsWith("__products:")) meta.productNames = line.slice("__products:".length).trim();
          else commentLines.push(line);
        }
        meta.comment = commentLines.join("\n").trim();
        return meta;
      }

      function visitItems(items, emptyText, kind) {
        const list = Array.isArray(items) ? items : [];
        if (!list.length) return `<p class="cabinet-history-empty">${escapeHtml(emptyText)}</p>`;
        return `<ul class="cabinet-visit-items">${list.map((item) => `<li>${escapeHtml(visitItemName(item, kind))}</li>`).join("")}</ul>`;
      }

      function visitModal() {
        const selected = selectedVisit;
        if (!selected) return "";
        const visit = selected.visit || selected;
        const parsed = parseVisitComment(visit.comment);
        const services = (selected.services || visit.yclients_services || []).length
          ? (selected.services || visit.yclients_services || [])
          : (parsed.serviceNames ? parsed.serviceNames.split(",").map((name) => ({ name: name.trim() })).filter((item) => item.name) : []);
        const products = (selected.products || visit.yclients_goods_transactions || []).length
          ? (selected.products || visit.yclients_goods_transactions || [])
          : (parsed.productNames ? parsed.productNames.split(",").map((name) => ({ name: name.trim() })).filter((item) => item.name) : []);
        return `
          <div class="modal-backdrop" data-cabinet-visit-modal>
            <div class="modal-card">
              <div class="modal-head">
                <h3>\u0412\u0438\u0437\u0438\u0442</h3>
                <button type="button" class="ghost" data-cabinet-close-visit>\u0417\u0430\u043a\u0440\u044b\u0442\u044c</button>
              </div>
              <div class="modal-grid">
                <div class="readonly-field"><span>\u0414\u0430\u0442\u0430 \u0438 \u0432\u0440\u0435\u043c\u044f</span><b>${escapeHtml(dateTime(visit.visit_at || visit.created_at) || "-")}</b></div>
                <div class="readonly-field"><span>\u0421\u0442\u0430\u0442\u0443\u0441 \u0432\u0438\u0437\u0438\u0442\u0430</span><b>${escapeHtml(visitStatus(visit.visit_status || visit.attendance_title))}</b></div>
                <div class="readonly-field"><span>\u0424\u0438\u043b\u0438\u0430\u043b</span><b>${escapeHtml(visit.branch_id || "-")}</b></div>
                <div class="readonly-field"><span>\u041c\u0430\u0441\u0442\u0435\u0440</span><b>${escapeHtml(visit.employee_id || "-")}</b></div>
                <div class="readonly-field"><span>\u0423\u0441\u043b\u0443\u0433\u0438</span>${visitItems(services, "\u0423\u0441\u043b\u0443\u0433 \u043d\u0435\u0442", "\u0423\u0441\u043b\u0443\u0433\u0430")}</div>
                <div class="readonly-field"><span>\u0422\u043e\u0432\u0430\u0440\u044b</span>${visitItems(products, "\u0422\u043e\u0432\u0430\u0440\u043e\u0432 \u043d\u0435\u0442", "\u0422\u043e\u0432\u0430\u0440")}</div>
                <div class="readonly-field"><span>\u0421\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c</span><b>${escapeHtml(money(visit.total_cost))}</b></div>
                <div class="readonly-field"><span>\u0421\u043a\u0438\u0434\u043a\u0430</span><b>${escapeHtml(money(visit.discount_amount))}</b></div>
                <div class="readonly-field"><span>\u041e\u043f\u043b\u0430\u0447\u0435\u043d\u043e</span><b>${escapeHtml(money(visit.paid_amount))}</b></div>
              </div>
            </div>
          </div>
        `;
      }

      function sectionBody(section) {
        const client = cabinetData?.client || currentClient;
        if (section === "client_name") return `<b>${escapeHtml(clientName(client))}</b>`;
        if (section === "client_level") {
          const level = client?.client_level || cabinetData?.metric?.client_level || cabinetData?.metric?.loyalty_level || "\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d";
          return `<b>${escapeHtml(level)}</b>`;
        }
        if (section === "client_visits") {
          const visits = cabinetData?.visits || [];
          if (!visits.length) return `<p class="cabinet-history-empty">\u0412\u0438\u0437\u0438\u0442\u043e\u0432 \u043f\u043e\u043a\u0430 \u043d\u0435\u0442.</p>`;
          return `
            <div class="cabinet-visit-list">
              ${visits.slice(0, 10).map((item) => {
                const visit = item.visit || item;
                return `<button type="button" class="cabinet-visit-button" data-cabinet-visit="${escapeHtml(visit.id)}"><b>${escapeHtml(dateTime(visit.visit_at || visit.created_at) || "\u0414\u0430\u0442\u0430 \u043d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u0430")}</b><span>${escapeHtml(visitStatus(visit.visit_status || visit.source))}</span></button>`;
              }).join("")}
            </div>
          `;
        }
        if (section === "client_chat") return `<p class="cabinet-history-empty">\u0427\u0430\u0442 \u043f\u043e\u043a\u0430 \u043d\u0435 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d.</p>`;
        if (section.startsWith("bonus_")) {
          const code = section.replace(/^bonus_/, "") || "cashback";
          const balance = (cabinetData?.bonus_balances || []).find((item) => (item.bonus_type || "cashback") === code);
          return `<b>${escapeHtml(money(balance?.balance || 0))}</b><span>\u0431\u0430\u043b\u043b\u043e\u0432</span>`;
        }
        return "";
      }

      function renderHistorySections(sections) {
        const enabled = Array.isArray(sections) ? sections : defaultCardSections;
        currentCardSections = enabled;
        if (!enabled.length) {
          historyList.innerHTML = '<p class="cabinet-history-empty">\u0414\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u043a\u043b\u0438\u0435\u043d\u0442\u0430 \u0440\u0430\u0437\u0434\u0435\u043b\u044b \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u044b.</p>';
          return;
        }
        historyList.innerHTML = enabled.map((section) => `
          <article class="cabinet-history-card">
            <span>${escapeHtml(sectionTitle(section))}</span>
            <div class="cabinet-history-body">${sectionBody(section)}</div>
          </article>
        `).join("");
        historyList.insertAdjacentHTML("beforeend", visitModal());
      }

      function achievementPhotoUrl(item) {
        if (!item?.id || !item.photo_file_id) return "";
        const version = encodeURIComponent(item.updated_at || item.photo_file_id);
        return `/organizations/achievements/${item.id}/photo?v=${version}`;
      }

      function renderAchievements() {
        const all = cabinetData?.organization_achievements || [];
        const received = cabinetData?.achievements || [];
        const receivedIds = new Set(received.map((item) => String(item.achievement_id)));
        const cards = (items) => items.length ? items.map((item) => `
          <article class="cabinet-achievement-card ${receivedIds.has(String(item.id)) ? "is-earned" : ""}">
            <button type="button" class="cabinet-achievement-button" data-cabinet-achievement="${item.id}">
              <b>${escapeHtml(item.name)}</b>
            </button>
          </article>
        `).join("") : '<p class="cabinet-history-empty">Нет достижений.</p>';
        const completed = all.filter((item) => receivedIds.has(String(item.id)));
        achievementsList.innerHTML = `
          <section class="cabinet-achievement-column">
            <h2>Все</h2>
            <div class="cabinet-achievement-column-list">${cards(all)}</div>
          </section>
          <section class="cabinet-achievement-column">
            <h2>Выполненные</h2>
            <div class="cabinet-achievement-column-list">${cards(completed)}</div>
          </section>
        `;
      }

      function openAchievementModal(item) {
        const photoUrl = achievementPhotoUrl(item);
        achievementContent.innerHTML = `
          ${photoUrl ? `<img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(item.name)}" class="cabinet-achievement-modal-photo">` : ""}
          <h4 class="cabinet-achievement-modal-title">${escapeHtml(item.name)}</h4>
        `;
        achievementModal.hidden = false;
      }

      function setCabinetTab(tab) {
        document.querySelectorAll("[data-cabinet-tab]").forEach((link) => link.classList.toggle("active", link.dataset.cabinetTab === tab));
        document.querySelectorAll("[data-cabinet-view]").forEach((view) => {
          view.hidden = view.dataset.cabinetView !== tab;
        });
        if (tab === "achievements") renderAchievements();
      }

      function openCabinetMenu() {
        const menu = document.querySelector("[data-cabinet-menu]");
        if (!menu) return;
        menu.removeAttribute("hidden");
        requestAnimationFrame(() => menu.classList.add("is-open"));
      }

      function closeCabinetMenu() {
        const menu = document.querySelector("[data-cabinet-menu]");
        if (!menu || menu.hasAttribute("hidden")) return;
        menu.classList.remove("is-open");
        window.setTimeout(() => menu.setAttribute("hidden", ""), 230);
      }

      function setRegistrationMode(enabled) {
        if (cabinetTitle) cabinetTitle.textContent = enabled ? "\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0430" : "\u041c\u043e\u0438 \u0434\u0430\u043d\u043d\u044b\u0435";
        if (historySection) historySection.hidden = enabled;
        submitButton.textContent = enabled ? "\u0417\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c\u0441\u044f" : "\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0434\u0430\u043d\u043d\u044b\u0435";
        form.dataset.cabinetRegistration = enabled ? "true" : "false";
        setCabinetEditMode(enabled);
      }

      function setCabinetEditMode(enabled) {
        const registration = form.dataset.cabinetRegistration === "true";
        const editing = registration || enabled;
        const lockedFields = new Set(["telegram_id", "max_id", "vk_id"]);
        form.querySelectorAll("[data-cabinet-field]").forEach((field) => {
          field.querySelectorAll("input, select, textarea").forEach((control) => {
            control.disabled = field.hidden || lockedFields.has(field.dataset.cabinetField) || !editing;
          });
        });
        document.querySelector("[data-cabinet-actions]").hidden = !editing;
        document.querySelector("[data-cabinet-edit]").hidden = registration || editing;
      }

      function applyRegistrationFields(fields) {
        const enabled = Array.isArray(fields) ? fields : defaultRegistrationFields;
        const fieldsByName = new Map([...form.querySelectorAll("[data-cabinet-field]")].map((field) => [field.dataset.cabinetField, field]));
        const order = [...enabled, ...defaultRegistrationFields.filter((name) => !enabled.includes(name))];
        order.forEach((name) => {
          const field = fieldsByName.get(name);
          if (field) form.insertBefore(field, form.querySelector("[data-cabinet-message]"));
        });
        fieldsByName.forEach((field) => {
          const isVisible = enabled.includes(field.dataset.cabinetField);
          field.hidden = !isVisible;
          field.style.display = isVisible ? "" : "none";
          field.querySelectorAll("input, select, textarea").forEach((control) => {
            control.disabled = !isVisible;
            if (!isVisible) control.required = false;
          });
        });
        setCabinetEditMode(form.dataset.cabinetRegistration === "true");
      }

      function textValue(data, name) {
        return String(data[name] || "").trim();
      }

      function optionalNumber(value) {
        const trimmed = String(value || "").trim();
        return trimmed ? Number(trimmed) : null;
      }

      function setMessage(text, kind = "") {
        message.textContent = text;
        message.dataset.kind = kind;
      }

      function cabinetSubmitPayload() {
        const data = Object.fromEntries(new FormData(form).entries());
        return {
          last_name: textValue(data, "last_name") || null,
          first_name: textValue(data, "first_name") || null,
          middle_name: textValue(data, "middle_name") || null,
          primary_phone: textValue(data, "phone") || null,
          gender: textValue(data, "gender") || null,
          telegram_id: optionalNumber(data.telegram_id),
          max_id: optionalNumber(data.max_id),
          vk_id: optionalNumber(data.vk_id),
          email: textValue(data, "email") || null,
        };
      }
      function fillCurrentUserCabinet(user) {
        const values = {
          last_name: user.last_name || "",
          first_name: user.first_name || "",
          middle_name: user.middle_name || "",
          phone: user.phone || user.primary_phone || "",
          gender: user.gender || "",
          telegram_id: user.telegram_id || "",
          max_id: user.max_id || "",
          vk_id: user.vk_id || "",
          email: user.email || "",
        };
        Object.entries(values).forEach(([name, value]) => {
          const control = form.elements[name];
          if (control) control.value = value;
        });
      }

      async function consumeLink() {
        applyRegistrationFields([]);
        renderHistorySections([]);
        setRegistrationMode(false);
        if (!token) {
          try {
            const result = await currentUser();
            if (!result) throw new Error();
            const cabinetResponse = await fetch("/auth/cabinet");
            cabinetData = cabinetResponse.ok ? await cabinetResponse.json() : null;
            currentClient = cabinetData?.client || null;
            applyRegistrationFields(cabinetData?.registration_fields);
            fillCurrentUserCabinet(currentClient || result);
            renderHistorySections(cabinetData?.card_sections ?? defaultCardSections);
            await refreshPushState().catch(() => null);
            await refreshNotificationsList().catch(() => null);
            setMessage("", "");
            submitButton.disabled = false;
          } catch {
            setMessage("\u0421\u0435\u0441\u0441\u0438\u044f \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\u0430. \u0412\u043e\u0439\u0434\u0438\u0442\u0435 \u0441\u043d\u043e\u0432\u0430.", "error");
            submitButton.disabled = true;
          }
          return;
        }
        submitButton.disabled = true;
        try {
          const response = await fetch(`/auth/client-auth-links/${encodeURIComponent(token)}/consume`, { method: "POST" });
          if (!response.ok) throw new Error();
          const link = await response.json();
          cabinetData = link;
          currentClient = link.client || link.profile || null;
          setRegistrationMode(!link.client_id);
          applyRegistrationFields(link.registration_fields);
          fillCurrentUserCabinet(currentClient || {});
          renderHistorySections(link.card_sections);
          await refreshPushState().catch(() => null);
          await refreshNotificationsList().catch(() => null);
          submitButton.disabled = false;
        } catch {
          const text = "\u0421\u0441\u044b\u043b\u043a\u0430 \u043d\u0435\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u0430 \u0438\u043b\u0438 \u0443\u0436\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0430.";
          alert(text);
          setMessage(text, "error");
          document.querySelector(".cabinet-shell")?.setAttribute("hidden", "");
          location.replace("/auth.html");
        }
      }

      document.querySelectorAll("[data-cabinet-tab]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          setCabinetTab(link.dataset.cabinetTab);
          closeCabinetMenu();
          history.replaceState(null, "", link.dataset.cabinetTab === "achievements" ? "#achievements" : "#my-data");
        });
      });

      document.addEventListener("click", async (event) => {
        if (event.target.closest("[data-cabinet-menu-open]")) {
          openCabinetMenu();
          return;
        }

        if (event.target.closest("[data-cabinet-edit]")) {
          setCabinetEditMode(true);
          return;
        }

        if (event.target.closest("[data-cabinet-menu-close]") || event.target.matches("[data-cabinet-menu]")) {
          closeCabinetMenu();
          return;
        }

        if (event.target.closest("[data-cabinet-notifications-open]")) {
          notificationsModal.hidden = false;
          await refreshPushState().catch(() => null);
          await refreshNotificationsList({ markSeen: true }).catch(() => null);
          return;
        }

        if (event.target.closest("[data-cabinet-notifications-close]") || event.target.matches("[data-cabinet-notifications-modal]")) {
          notificationsModal.hidden = true;
          return;
        }

        const achievementButton = event.target.closest("[data-cabinet-achievement]");
        if (achievementButton) {
          const achievement = (cabinetData?.organization_achievements || []).find((item) => String(item.id) === achievementButton.dataset.cabinetAchievement);
          if (achievement) openAchievementModal(achievement);
          return;
        }

        if (event.target.closest("[data-cabinet-achievement-close]") || event.target.matches("[data-cabinet-achievement-modal]")) {
          achievementModal.hidden = true;
          return;
        }

        const visitButton = event.target.closest("[data-cabinet-visit]");
        if (visitButton) {
          selectedVisit = (cabinetData?.visits || []).find((item) => String((item.visit || item).id) === String(visitButton.dataset.cabinetVisit)) || null;
          renderHistorySections(currentCardSections);
          return;
        }

        if (event.target.closest("[data-cabinet-close-visit]") || event.target.matches("[data-cabinet-visit-modal]")) {
          selectedVisit = null;
          renderHistorySections(currentCardSections);
          return;
        }

        if (event.target.closest("[data-cabinet-logout]")) {
          await fetch("/auth/logout", { method: "POST" }).catch(() => null);
          localStorage.removeItem(SESSION_TOKEN_KEY);
          location.href = "/auth.html?mode=login";
        }
      });

      pushToggleControl.addEventListener("click", async (event) => {
        event.preventDefault();
        if (pushToggle.disabled) return;
        const enable = !pushToggle.checked;
        pushToggle.checked = enable;
        pushToggle.disabled = true;
        try {
          if (enable) await enablePushNotifications();
          else await disablePushNotifications();
        } catch (error) {
          pushToggle.checked = !enable;
          pushStatus.textContent = error.message || "Не удалось обновить уведомления.";
        } finally {
          pushToggle.disabled = false;
        }
      });

      setCabinetTab("profile");
      consumeLink();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        setMessage("\u0421\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u043c \u0434\u0430\u043d\u043d\u044b\u0435...");

        try {
          const profile = cabinetSubmitPayload();
          const endpoint = token
            ? `/public-api/client-auth-links/${encodeURIComponent(token)}/submit`
            : currentClient?.id
              ? `/crm-api/clients-core/clients/${encodeURIComponent(currentClient.id)}`
              : "";
          if (!endpoint) throw new Error("\u041a\u043b\u0438\u0435\u043d\u0442 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d.");
          const response = await fetch(endpoint, {
            method: token ? "POST" : "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(token ? {
              last_name: profile.last_name,
              first_name: profile.first_name,
              middle_name: profile.middle_name,
              phone: profile.primary_phone,
              gender: profile.gender,
              telegram_id: profile.telegram_id,
              max_id: profile.max_id,
              vk_id: profile.vk_id,
              email: profile.email,
            } : profile),
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0434\u0430\u043d\u043d\u044b\u0435");
          }
          const result = await response.json();
          if (result.redirect_url) {
            location.href = result.redirect_url;
            return;
          }
          currentClient = result.client || null;
          if (!currentClient && !token) currentClient = result || null;
          renderHistorySections(currentCardSections);
          setMessage("\u0414\u0430\u043d\u043d\u044b\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u044b.", "success");
          if (!token) setCabinetEditMode(false);
          submitButton.disabled = false;
        } catch (error) {
          setMessage(error.message, "error");
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
